# Netlify config for the Limitless (Hyatt) Opal POC.
# The Astro app IS the repo root, so there's no `base` to set — Netlify builds
# here and the @astrojs/netlify adapter emits the SSR function.

[build]
  command = "yarn build"
  publish = "dist"

[build.environment]
  NODE_VERSION  = "22"
  YARN_VERSION  = "4.12.0"
  YARN_ENABLE_IMMUTABLE_INSTALLS = "false"

[functions]
  node_bundler = "esbuild"
